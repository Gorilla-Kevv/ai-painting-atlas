  <style>
    html, body { height: 100%; margin: 0; overflow: hidden; background: var(--bg-0); }
    #scene { position: fixed; inset: 0; z-index: 5; }
    #scene canvas { display: block; }
    #labels { position: fixed; inset: 0; z-index: 8; pointer-events: none; overflow: hidden; }
    .nn-label {
      position: absolute; transform: translate(-50%, -50%);
      font-family: "Manrope", "Noto Sans SC", sans-serif; font-size: 10.5px; font-weight: 400;
      color: #aeb6c8; padding: 1px 6px; border-radius: 6px; white-space: nowrap;
      text-shadow: 0 1px 3px rgba(0,0,0,0.65); transition: color .2s, font-size .2s, opacity .2s;
      pointer-events: none; opacity: 0.82; letter-spacing: 0.01em;
    }
    .nn-label.big { font-size: 12px; opacity: 0.95; }
    .nn-label.hover { color: #dbeafe; font-size: 12px; }
    .nn-label.dim { opacity: 0.2; }

    .net-header {
      position: fixed; top: 0; left: 0; right: 0; z-index: 20;
      padding: 18px 28px 16px;
      background: linear-gradient(180deg, rgba(7,9,14,0.92), rgba(7,9,14,0.5) 70%, transparent);

    .net-brand { display: flex; align-items: center; gap: 12px; }
    .net-glyph {
      width: 38px; height: 38px; display: grid; place-items: center;
      background: linear-gradient(135deg, var(--c-mint), var(--c-rose));
      color: var(--bg-0); font-family: var(--font-display); font-weight: 800; font-size: 20px;
      border-radius: 10px; transform: rotate(-4deg); box-shadow: 0 0 24px rgba(0,255,200,0.4);
    }
    .net-glyph img {
      width: 118%; height: 118%;
      object-fit: contain; display: block;
      margin: -10% auto 0;
      filter: drop-shadow(0 2px 5px rgba(0,0,0,0.35));
    }
    .net-title { font-family: var(--font-display); font-weight: 800; font-size: 19px; color: var(--text-0); letter-spacing: -0.02em; line-height: 1.1; }
    .net-sub { font-family: var(--font-mono); font-size: 10.5px; color: var(--c-mint); letter-spacing: 0.18em; text-transform: uppercase; margin-top: 2px; }
    .net-actions { margin-left: auto; display: flex; gap: 10px; align-items: center; }
    .net-btn {
      font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.05em;
      padding: 9px 16px; border-radius: 100px; cursor: pointer; transition: all 0.2s var(--ease);
      border: 1px solid var(--line-strong); color: var(--text-1); background: var(--bg-2);

    }
    .net-btn:hover { color: var(--c-mint); border-color: var(--c-mint); background: rgba(0,255,200,0.08); }
    .net-btn.primary { background: linear-gradient(135deg, var(--c-mint), var(--c-rose)); color: var(--bg-0); border: none; font-weight: 600; }
    .net-btn.primary:hover { filter: brightness(1.1); transform: translateY(-1px); }

    .net-legend {
      position: fixed; left: 18px; bottom: 18px; z-index: 15;
      background: rgba(18,22,32,0.72); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px;
      display: flex; flex-direction: column; gap: 8px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    }
    .net-legend .lt { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--text-3); margin-bottom: 2px; }
    .net-legend .li { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--text-1); }
    .net-legend .d { width: 11px; height: 11px; border-radius: 50%; box-shadow: 0 0 10px currentColor; }

    .net-hint {
      position: fixed; right: 18px; bottom: 18px; z-index: 15;
      font-family: var(--font-mono); font-size: 11px; color: var(--text-3); letter-spacing: 0.05em;
      background: rgba(18,22,32,0.7); padding: 8px 14px; border-radius: 100px; border: 1px solid var(--line);
    }

    .net-tip {
      position: fixed; z-index: 30; max-width: 280px;
      background: rgba(18,22,32,0.85); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(255,255,255,0.16); border-radius: 10px;
      padding: 12px 14px; pointer-events: none; opacity: 0;
      transform: translateY(6px); transition: opacity 0.18s, transform 0.18s;

    .net-tip.show { opacity: 1; transform: translateY(0); }
    .net-tip .tt-cat { font-family: var(--font-mono); font-size: 9.5px; letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 4px; }
    .net-tip .tt-name { font-family: var(--font-display); font-weight: 700; font-size: 15px; color: var(--text-0); margin-bottom: 4px; }
    .net-tip .tt-blurb { font-size: 12.5px; color: var(--text-2); line-height: 1.55; }

    .net-detail {
      position: fixed; right: 0; top: 0; bottom: 0; z-index: 25; width: 420px; max-width: 92vw;
      background: linear-gradient(180deg, rgba(16,22,32,0.92), rgba(10,14,20,0.96));

    .net-detail.show { transform: translateX(0); }
    .nd-head { padding: 22px 22px 14px; border-bottom: 1px solid var(--line); flex-shrink: 0; }
    .nd-cat { display: inline-block; font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; padding: 3px 10px; border-radius: 100px; margin-bottom: 10px; border: 1px solid; }
    .nd-name { font-family: var(--font-display); font-weight: 800; font-size: 26px; color: var(--text-0); letter-spacing: -0.02em; line-height: 1.1; }
    .nd-body { flex: 1; overflow-y: auto; padding: 20px 22px 28px; }
    .nd-section { margin-bottom: 22px; }
    .nd-label { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--text-3); margin-bottom: 10px; }
    .nd-blurb { font-size: 14.5px; color: var(--text-1); line-height: 1.72; }
    .nd-links { display: flex; flex-direction: column; gap: 8px; }
    .nd-link {
      display: flex; align-items: center; gap: 10px; text-decoration: none;
      padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px;
      background: var(--bg-card); transition: all 0.18s var(--ease);
    }
    .nd-link:hover { border-color: var(--c-mint); background: var(--bg-2); transform: translateX(-2px); }
    .nd-link .ic { width: 32px; height: 32px; display: grid; place-items: center; border-radius: 8px; font-size: 16px; flex-shrink: 0; }
    .nd-link .t1 { font-size: 13.5px; color: var(--text-0); font-weight: 600; }
    .nd-link .t2 { font-size: 11.5px; color: var(--text-2); margin-top: 2px; }
    .nd-link .ar { color: var(--c-mint); font-family: var(--font-mono); margin-left: auto; }
    .nd-rels { display: flex; flex-wrap: wrap; gap: 7px; }
    .nd-rel {
      font-size: 12px; padding: 5px 11px; border-radius: 100px; cursor: pointer;
      border: 1px solid var(--line-strong); color: var(--text-1); background: var(--bg-2);
      transition: all 0.16s;
    }
    .nd-rel:hover { color: var(--text-0); border-color: var(--c-mint); }
    .nd-rel .rl { font-family: var(--font-mono); font-size: 9.5px; color: var(--text-3); margin-left: 6px; }
    .nd-close { position: absolute; top: 18px; right: 18px; width: 30px; height: 30px; display: grid; place-items: center; border: 1px solid var(--line-strong); border-radius: 8px; color: var(--text-2); cursor: pointer; font-size: 15px; background: transparent; }
    .nd-close:hover { color: var(--c-rose); border-color: var(--c-rose); }

    .net-intro {
      position: fixed; left: 50%; top: 76px; transform: translateX(-50%); z-index: 14;
      max-width: 640px; padding: 12px 22px; border-radius: 14px;
      background: rgba(18,22,32,0.62); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--line); box-shadow: 0 10px 30px rgba(0,0,0,0.35);
      font-size: 13px; color: var(--text-1); line-height: 1.6; text-align: center;
      display: none;
    }
    .net-intro.show { display: block; }
    .net-intro b { color: var(--c-mint); }
    .net-intro .dismiss { font-family: var(--font-mono); font-size: 11px; color: var(--text-3); cursor: pointer; margin-left: 10px; }
    .net-intro .dismiss:hover { color: var(--c-rose); }

    @media (max-width: 720px) {
      .net-detail { width: 92vw; }
      .net-legend { display: none; }
      .net-intro { max-width: 92vw; top: 130px; }
    }
  </style>
</head>

  <header class="net-header">

  <div class="net-intro" id="netIntro">
    <b>为什么用神经网络图谱？</b> 传统目录线性孤立地罗列知识点，新手难以看出关联。本页把「整合方案、主流模型、微调技术、技术原理」映射为互联的 3D 节点网络——一条连线就是一条技术原理对应关系（如 ComfyUI→SD→U-Net→扩散模型）。沿连线走即可理解「工具用了什么模型、模型基于什么原理、原理又被哪些微调扩展」，从任意节点出发都能构建完整知识链，显著降低入门门槛。

      </div>

        <div class="nd-rels" id="ndRels"></div>
      </div>

  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
  <script src="js/network-data.js?v=20260926c"></script>
  <script>
  (function () {
    "use strict";
    const D = window.NETWORK_DATA;
    if (!D || !THREE) return;
    const cats = D.categories;
    const nodes = D.nodes, edges = D.edges;
    const idx = {}; nodes.forEach((n, i) => (idx[n.id] = i));
    const colorOf = (cat) => new THREE.Color(cats[cat].color);

    /* ---------- 图例 ---------- */
    const legend = document.getElementById("legend");
    legend.innerHTML = `<div class="lt">节点类别</div>` +
      Object.values(cats).map(c => `<div class="li"><span class="d" style="background:${c.color};color:${c.color}"></span>${c.name}</div>`).join("");

    /* ---------- Three.js 场景 ---------- */
    const container = document.getElementById("scene");
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setClearColor(0x000000, 0);
    container.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x07090e, 0.012);
    const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 2000);

    // 背景星点
    {
      const N = 600, arr = new Float32Array(N * 3);
      for (let i = 0; i < N; i++) { arr[i*3]=(Math.random()-0.5)*400; arr[i*3+1]=(Math.random()-0.5)*400; arr[i*3+2]=(Math.random()-0.5)*400; }
      const g = new THREE.BufferGeometry(); g.setAttribute("position", new THREE.BufferAttribute(arr, 3));
      scene.add(new THREE.Points(g, new THREE.PointsMaterial({ color: 0x2a3346, size: 0.6, transparent: true, opacity: 0.7, depthWrite: false })));
    }

    /* ---------- 力导向布局（预计算 3D 位置） ---------- */
    const pos = nodes.map(() => new THREE.Vector3((Math.random()-0.5)*55, (Math.random()-0.5)*55, (Math.random()-0.5)*55));
    for (let iter = 0; iter < 320; iter++) {
      for (let i = 0; i < pos.length; i++) {
        for (let j = i + 1; j < pos.length; j++) {
          const d = pos[i].clone().sub(pos[j]); let l = d.length();
          if (l < 0.01) { d.set(Math.random()-0.5, Math.random()-0.5, Math.random()-0.5); l = 0.5; }
          const f = 150 / (l * l) * 0.5; d.multiplyScalar(f / l);
          pos[i].add(d.clone().multiplyScalar(0.5)); pos[j].add(d.multiplyScalar(-0.5));
        }
      }
      edges.forEach(e => {
        const a = pos[idx[e.s]], b = pos[idx[e.t]]; const d = b.clone().sub(a); const l = d.length();
        const f = (l - 15) * 0.05; d.multiplyScalar(f / Math.max(l, 0.01));
        a.add(d); b.sub(d);
      });
      pos.forEach(p => p.multiplyScalar(0.993));
    }

    /* ---------- 节点：发光球体（内核 + 外层 glow） ---------- */
    const nodeGroup = new THREE.Group(); scene.add(nodeGroup);
    const nodeObjs = nodes.map((n, i) => {
      const c = colorOf(n.cat);
      const g = new THREE.Group();
      const isCore = n.id === "m-sd";
      const r = isCore ? 1.2 : (n.cat === "M" ? 0.8 : 0.55);
      // 内核
      const core = new THREE.Mesh(
        new THREE.SphereGeometry(r, 28, 28),
        new THREE.MeshBasicMaterial({ color: c })
      );
      // glow 光晕（加性混合透明壳，偏蓝柔和）
      const glow = new THREE.Mesh(
        new THREE.SphereGeometry(r * 2.0, 20, 20),
        new THREE.MeshBasicMaterial({ color: c, transparent: true, opacity: 0.13, blending: THREE.AdditiveBlending, depthWrite: false })
      );
      const glow2 = new THREE.Mesh(
        new THREE.SphereGeometry(r * 1.35, 20, 20),
        new THREE.MeshBasicMaterial({ color: c, transparent: true, opacity: 0.18, blending: THREE.AdditiveBlending, depthWrite: false })
      );
      g.add(core, glow2, glow);
      g.position.copy(pos[i]);
      g.userData = { node: n, core, glow, glow2, baseR: r, scale: 1, targetScale: 1, color: c, index: i };
      nodeGroup.add(g);
      return g;
    });

    /* ---------- 边：渐变连线 + 流光粒子 ---------- */
    const edgeObjs = edges.map(e => {
      const a = pos[idx[e.s]], b = pos[idx[e.t]];
      const cA = colorOf(nodes[idx[e.s]].cat), cB = colorOf(nodes[idx[e.t]].cat);
      const mid = cA.clone().lerp(cB, 0.5);
      // 粗圆柱连线（TubeGeometry，连续不中断，随节点同步旋转）
      const path = new THREE.LineCurve3(a.clone(), b.clone());
      const geo = new THREE.TubeGeometry(path, 1, 0.07, 8, false);
      const mat = new THREE.MeshBasicMaterial({ color: mid, transparent: true, opacity: 0.5, blending: THREE.AdditiveBlending, depthWrite: false });
      const line = new THREE.Mesh(geo, mat); nodeGroup.add(line);
      // 流光小球（沿线流动，随节点同步）
      const flow = new THREE.Mesh(
        new THREE.SphereGeometry(0.12, 8, 8),
        new THREE.MeshBasicMaterial({ color: 0xaad4ff, transparent: true, opacity: 0.9, blending: THREE.AdditiveBlending, depthWrite: false })
      );
      nodeGroup.add(flow);
      return { line, mat, flow, a, b, cA, cB, t: Math.random(), speed: 0.0035 + Math.random() * 0.004, e };
    });

    /* ---------- 节点标签（HTML 投影层） ---------- */
    const labelLayer = document.getElementById("labels");
    const labels = nodes.map(n => {
      const el = document.createElement("div");
      el.className = "nn-label" + (n.id === "m-sd" ? " big" : "");
      el.textContent = n.label;
      labelLayer.appendChild(el);
      return el;
    });

    /* ---------- 相机控制（球坐标：左键旋转 / 滚轮缩放 / 右键平移） ---------- */
    const cam = { theta: 0.8, phi: 1.1, dist: 52, target: new THREE.Vector3() };
    function updateCamera() {
      camera.position.set(
        cam.dist * Math.sin(cam.phi) * Math.cos(cam.theta),
        cam.dist * Math.cos(cam.phi),
        cam.dist * Math.sin(cam.phi) * Math.sin(cam.theta)
      ).add(cam.target);
      camera.lookAt(cam.target);
    }
    updateCamera();

    let dragging = false, panMode = false, lastX = 0, lastY = 0, downX = 0, downY = 0, downT = 0;
    renderer.domElement.addEventListener("mousedown", (e) => {
      dragging = true; panMode = (e.button === 2 || e.button === 1); lastX = downX = e.clientX; lastY = downY = e.clientY; downT = Date.now();
      if (e.button === 1) e.preventDefault(); // 阻止中键默认自动滚动
    });
    window.addEventListener("mousemove", (e) => {
      if (!dragging) return;
      const dx = e.clientX - lastX, dy = e.clientY - lastY; lastX = e.clientX; lastY = e.clientY;
      if (panMode) {
        const v = new THREE.Vector3(); camera.getWorldDirection(v);
        const right = new THREE.Vector3().crossVectors(v, camera.up).normalize();
        const up = camera.up.clone();
        const s = cam.dist * 0.0015;
        cam.target.addScaledVector(right, -dx * s).addScaledVector(up, dy * s);
      } else {
        cam.theta -= dx * 0.005; cam.phi -= dy * 0.005;
        cam.phi = Math.max(0.2, Math.min(Math.PI - 0.2, cam.phi));
      }
      updateCamera();
    });
    window.addEventListener("mouseup", (e) => {
      const moved = Math.hypot(e.clientX - downX, e.clientY - downY);
      const quick = (Date.now() - downT) < 300 && moved < 5;
      dragging = false; panMode = false;
      if (quick) handleClick(e);
    });
    renderer.domElement.addEventListener("contextmenu", (e) => e.preventDefault());
    renderer.domElement.addEventListener("wheel", (e) => {
      e.preventDefault();
      cam.dist *= (1 + e.deltaY * 0.0012);
      cam.dist = Math.max(14, Math.min(110, cam.dist));
      updateCamera();
    }, { passive: false });

    // 触屏：单指旋转、双指缩放
    let touchPrev = null, pinchPrev = null;
    renderer.domElement.addEventListener("touchstart", (e) => {
      if (e.touches.length === 1) { touchPrev = { x: e.touches[0].clientX, y: e.touches[0].clientY }; downT = Date.now(); downX = e.touches[0].clientX; downY = e.touches[0].clientY; }
      else if (e.touches.length === 2) {
        const dx = e.touches[0].clientX - e.touches[1].clientX, dy = e.touches[0].clientY - e.touches[1].clientY;
        pinchPrev = Math.hypot(dx, dy);
      }
    }, { passive: true });
    renderer.domElement.addEventListener("touchmove", (e) => {
      if (e.touches.length === 1 && touchPrev) {
        const dx = e.touches[0].clientX - touchPrev.x, dy = e.touches[0].clientY - touchPrev.y;
        touchPrev = { x: e.touches[0].clientX, y: e.touches[0].clientY };
        cam.theta -= dx * 0.006; cam.phi -= dy * 0.006; cam.phi = Math.max(0.2, Math.min(Math.PI-0.2, cam.phi)); updateCamera();
      } else if (e.touches.length === 2 && pinchPrev) {
        const dx = e.touches[0].clientX - e.touches[1].clientX, dy = e.touches[0].clientY - e.touches[1].clientY;
        const d = Math.hypot(dx, dy); cam.dist *= pinchPrev / d; cam.dist = Math.max(14, Math.min(110, cam.dist)); pinchPrev = d; updateCamera(); e.preventDefault();
      }
    }, { passive: false });
    renderer.domElement.addEventListener("touchend", (e) => {
      const t = e.changedTouches[0];
      const moved = Math.hypot(t.clientX - downX, t.clientY - downY);
      if (Date.now() - downT < 350 && moved < 8) handleClick({ clientX: t.clientX, clientY: t.clientY });
      touchPrev = null; pinchPrev = null;
    });

    /* ---------- Raycaster 悬停与点击 ---------- */
    const raycaster = new THREE.Raycaster();
    const mouseNDC = new THREE.Vector2();
    let hovered = null;
    const tip = document.getElementById("tip");

    function pickNode(cx, cy) {
      mouseNDC.x = (cx / window.innerWidth) * 2 - 1;
      mouseNDC.y = -(cy / window.innerHeight) * 2 + 1;
      raycaster.setFromCamera(mouseNDC, camera);
      const cores = nodeObjs.map(o => o.userData.core);
      const hits = raycaster.intersectObjects(cores, false);
      return hits.length ? nodeObjs.find(o => o.userData.core === hits[0].object) : null;
    }

    renderer.domElement.addEventListener("mousemove", (e) => {
      if (dragging) { tip.classList.remove("show"); return; }
      const obj = pickNode(e.clientX, e.clientY);
      if (obj !== hovered) {
        if (hovered) hovered.userData.targetScale = 1;
        hovered = obj;
        if (hovered) {
          hovered.userData.targetScale = 1.45;
          const d = hovered.userData.node;
          tip.innerHTML = `<div class="tt-cat" style="color:${cats[d.cat].color}">${cats[d.cat].name}</div><div class="tt-name">${d.label}</div><div class="tt-blurb">${d.blurb}</div><div class="tt-cta">点击查看详情 →</div>`;
          tip.classList.add("show");
          renderer.domElement.style.cursor = "pointer";
        } else { tip.classList.remove("show"); renderer.domElement.style.cursor = "grab"; }
      }
      if (hovered) {
        let x = e.clientX + 16, y = e.clientY + 16;
        if (x + tip.offsetWidth > window.innerWidth - 8) x = e.clientX - tip.offsetWidth - 16;
        if (y + tip.offsetHeight > window.innerHeight - 8) y = e.clientY - tip.offsetHeight - 16;
        tip.style.left = x + "px"; tip.style.top = y + "px";
      }
    });

    /* ---------- 详情面板 ---------- */
    const detail = document.getElementById("detail");
    let activeId = null;
    function showDetail(nodeId) {
      const n = nodes[idx[nodeId]]; if (!n) return;
      activeId = nodeId;
      const cat = cats[n.cat];
      document.getElementById("ndCat").textContent = cat.name;
      document.getElementById("ndCat").style.color = cat.color;
      document.getElementById("ndCat").style.borderColor = cat.color + "66";
      document.getElementById("ndName").textContent = n.label;
      document.getElementById("ndBlurb").textContent = n.blurb;

      const rels = document.getElementById("ndRels"); rels.innerHTML = "";
      const connected = edges.filter(e => e.s === nodeId || e.t === nodeId);
      if (!connected.length) { document.getElementById("ndRelsWrap").style.display = "none"; }
      else {
        document.getElementById("ndRelsWrap").style.display = "";
        connected.forEach(e => {
          const otherId = e.s === nodeId ? e.t : e.s;
          const other = nodes[idx[otherId]];
          const dir = e.s === nodeId ? "→" : "←";
          const chip = document.createElement("span");
          chip.className = "nd-rel";
          chip.innerHTML = `${dir} ${other.label}<span class="rl">${e.l}</span>`;
          chip.style.borderColor = cats[other.cat].color + "55";
          chip.onclick = () => showDetail(otherId);
          rels.appendChild(chip);
        });
      }
      const links = document.getElementById("ndLinks"); links.innerHTML = "";
      if (n.detailRef) links.insertAdjacentHTML("beforeend",
        `<a class="nd-link" href="${n.detailRef}"><span class="ic" style="background:rgba(0,255,200,0.12);color:var(--c-mint)">📖</span><span><span class="t1">参考书详细解读</span><br><span class="t2">跳转对应章节完整说明</span></span><span class="ar">→</span></a>`);
      if (n.tut) links.insertAdjacentHTML("beforeend",
        `<a class="nd-link" href="${n.tut}"><span class="ic" style="background:rgba(255,184,0,0.14);color:var(--c-amber)">🛠</span><span><span class="t1">配置操作教程</span><br><span class="t2">含安装步骤与参考来源</span></span><span class="ar">→</span></a>`);
      if (!n.detailRef && !n.tut) links.innerHTML = `<div style="font-size:13px;color:var(--text-3)">该节点暂无独立文档，可沿关联节点继续探索。</div>`;
      detail.classList.add("show");
      // 平滑聚焦到该节点
      focusTarget = pos[idx[nodeId]].clone();
    }

    function handleClick(e) {
      const obj = pickNode(e.clientX, e.clientY);
      if (obj) showDetail(obj.userData.node.id);
    }
    document.getElementById("detailClose").addEventListener("click", () => { detail.classList.remove("show"); activeId = null; clearHighlight(); });
    document.addEventListener("keydown", (e) => { if (e.key === "Escape") { detail.classList.remove("show"); activeId = null; clearHighlight(); } });

    /* ---------- 高亮：激活节点邻边变亮，其余淡化 ---------- */
    function clearHighlight() { highlightId = null; }
    let highlightId = null;
    function applyHighlight() {
      const id = activeId || highlightId;
      edgeObjs.forEach(eo => {
        const isConn = id && (eo.e.s === id || eo.e.t === id);
        eo.mat.opacity = isConn ? 0.95 : (id ? 0.08 : 0.45);
      });
      nodeObjs.forEach(o => {
        const nid = o.userData.node.id;
        const isConn = id && (nid === id || edges.some(e => (e.s === id && e.t === nid) || (e.t === id && e.s === nid)));
        o.userData.dimmed = id ? !isConn : false;
      });
    }
    /* ---------- 聚焦目标平滑移动 ---------- */
    let focusTarget = null;

    /* ---------- 动画循环 ---------- */
    const tmp = new THREE.Vector3();
    let t = 0;
    function animate() {
      t += 0.016;
      // 整体缓慢自转
      nodeGroup.rotation.y += 0.0006;

      // 聚焦：target 平滑移向节点
      if (focusTarget) {
        cam.target.lerp(focusTarget, 0.06);
        if (cam.target.distanceTo(focusTarget) < 0.05) focusTarget = null;
        updateCamera();
      }

      // 高亮刷新
      applyHighlight();

      // 节点脉动 + scale lerp
      nodeObjs.forEach(o => {
        const u = o.userData;
        u.scale += (u.targetScale - u.scale) * 0.15;
        const pulse = 1 + Math.sin(t * 1.5 + u.index) * 0.04;
        o.scale.setScalar(u.scale * pulse);
        const op = u.dimmed ? 0.12 : 1;
        u.core.material.opacity = op; u.core.material.transparent = u.dimmed;
        u.glow.material.opacity = (u.dimmed ? 0.02 : 0.16) * (0.7 + Math.sin(t * 1.5 + u.index) * 0.3);
        u.glow2.material.opacity = u.dimmed ? 0.03 : 0.22;
      });

      // 边流光
      edgeObjs.forEach(eo => {
        eo.t += eo.speed; if (eo.t > 1) eo.t -= 1;
        eo.flow.position.lerpVectors(eo.a, eo.b, eo.t);
        const dim = (activeId && !(eo.e.s === activeId || eo.e.t === activeId));
        eo.flow.material.opacity = dim ? 0.05 : 0.85;
      });

      renderer.render(scene, camera);

      // 标签投影
      const v = new THREE.Vector3();
      nodeObjs.forEach((o, i) => {
        o.getWorldPosition(v);
        v.project(camera);
        const x = (v.x * 0.5 + 0.5) * window.innerWidth;
        const y = (-v.y * 0.5 + 0.5) * window.innerHeight;
        const visible = v.z < 1;
        const lbl = labels[i];
        lbl.style.left = x + "px"; lbl.style.top = (y + o.userData.baseR * 12 + 10) + "px";
        lbl.style.display = visible ? "block" : "none";
        lbl.classList.toggle("hover", hovered === o);
        lbl.classList.toggle("dim", nodeObjs[i].userData.dimmed);
      });

      requestAnimationFrame(animate);
    }
    animate();

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    /* ---------- 顶部说明 ---------- */
    const intro = document.getElementById("netIntro");
    document.getElementById("introBtn").addEventListener("click", () => intro.classList.toggle("show"));
    document.getElementById("introDismiss").addEventListener("click", () => intro.classList.remove("show"));
    setTimeout(() => intro.classList.add("show"), 700);
    setTimeout(() => intro.classList.remove("show"), 13000);
  })();
  </script>
</body>
</html>
